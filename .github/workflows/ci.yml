name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-notes-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notes-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --cov=app --cov-fail-under=70 -v

  test-external-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: external-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --cov=app --cov-fail-under=70 -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-notes-service, test-external-service]

    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up --build -d

      - name: Wait for services
        run: sleep 5

      - name: Check notes service
        run: curl -f http://localhost:5000/notes

      - name: Check external service
        run: curl -f http://localhost:5000/external/users

      - name: Tear down
        run: docker compose down
