version: '3.8'

services:
  notes-service:
    build: ./notes-service
    container_name: notes-service
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///notes_prod.db
    expose:
      - "5001"
    networks:
      - app-network

  external-service:
    build: ./external-service
    container_name: external-service
    environment:
      - FLASK_ENV=production
    expose:
      - "5002"
    networks:
      - app-network

  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "5000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - notes-service
      - external-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
